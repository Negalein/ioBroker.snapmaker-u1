name: Test and Release

# Run checks on pushes and pull requests. A published GitHub release is
# the explicit trigger for publishing the matching package to npm.
on:
  push:
    branches:
      - "main"
  pull_request: {}
  release:
    types: [published]

# Cancel previous PR/branch runs when a new commit is pushed
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Performs quick checks before the expensive test runs
  check-and-lint:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    runs-on: ubuntu-latest

    steps:
      - uses: ioBroker/testing-action-check$v2
        with:
          node-version: '22.x'
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          type-checking: true
          lint: true

  # Runs adapter tests on all supported node versions and OSes
  adapter-tests:
    needs: check-and-lint
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: ioBroker/testing-action-adapter$v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # Uncomment the following line if your adapter cannot be installed using 'npm ci'
          # install-command: 'npm install'
          build: true

  deploy:
    needs: [check-and-lint, adapter-tests]
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout$v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node$v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm$11
      - run: npm ci
      - run: npm run build
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Verify release tag is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$RELEASE_TAG")" origin/main
      - name: Publish stable release using npm trusted publishing
        run: npm publish --access public

  publish-prerelease:
    needs: [check-and-lint, adapter-tests]
    if: github.event_name == 'release' && github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout$v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-node$v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm$11
      - run: npm ci
      - run: npm run build
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Verify release tag is on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$RELEASE_TAG")" origin/main
      - name: Publish pre-release using npm trusted publishing
        run: npm publish --access public --tag next
