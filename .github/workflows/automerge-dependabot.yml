# Automatically merge eligible Dependabot PRs according to .github/auto-merge.yml.
# No PR code is checked out or executed by this workflow.

name: Auto-Merge Dependabot PRs

on:
  # Dependabot pull requests receive the permissions needed for auto-merge.
  # `pull_request` avoids the security risks of `pull_request_target`.
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Auto-merge eligible Dependabot PRs
        uses: iobroker-bot-orga/action-automerge-dependabot@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Keep the existing compact history for dependency updates.
          merge-method: squash
          wait-for-checks: 'true'
